<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Настройки сборщика запросов</title>
    <style>
      :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
      body { max-width: 640px; margin: 40px auto; padding: 0 20px; }
      label { display: block; margin: 18px 0 6px; font-weight: 600; }
      input { box-sizing: border-box; width: 100%; padding: 9px; }
      button { margin-top: 20px; padding: 9px 16px; }
      #status { margin-left: 10px; }
    </style>
  </head>
  <body>
    <h1>Сборщик сетевых запросов</h1>
    <p>Подключение расширения к локальному контроллеру.</p>
    <label for="controllerUrl">Адрес контроллера</label>
    <input id="controllerUrl" type="url" placeholder="http://127.0.0.1:8787" required>
    <label for="token">Токен</label>
    <input id="token" type="password" autocomplete="off" required>
    <button id="save">Сохранить</button><span id="status" role="status" aria-live="polite"></span>
    <script src="options.js"></script>
  </body>
</html>
